spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:image-back-server/.env[.properties]
  application:
    name: image-back-server
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8081

image:
  temp-retention-minutes: 180
  temp-cleanup-delay-ms: 3600000

attachment:
  max-size-bytes: 20971520
  orphan-grace-minutes: 60
  upload-rate-limit-per-minute: 12

app:
  jwt:
    secret: ${AUTH_JWT_SECRET}
  security:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    audience: semo-api
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002
      - http://localhost:3003
      - http://localhost:3004
      - http://127.0.0.1:3000
      - http://127.0.0.1:3001
      - http://127.0.0.1:3002
      - http://127.0.0.1:3003
      - http://127.0.0.1:3004
      - http://61.80.148.197:3000
      - http://61.80.148.197:3001
      - http://61.80.148.197:3002
      - http://61.80.148.197:3003
      - http://61.80.148.197:3004

management:
  endpoints:
    web:
      exposure:
        include: health,info
