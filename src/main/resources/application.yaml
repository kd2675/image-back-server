spring:
  application:
    name: image-back-server
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8081

image:
  temp-retention-minutes: 180
  temp-cleanup-delay-ms: 3600000

app:
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002
      - http://localhost:3003
      - http://localhost:3004
      - http://127.0.0.1:3000
      - http://127.0.0.1:3001
      - http://127.0.0.1:3002
      - http://127.0.0.1:3003
      - http://127.0.0.1:3004
      - http://61.80.148.197:3000
      - http://61.80.148.197:3001
      - http://61.80.148.197:3002
      - http://61.80.148.197:3003
      - http://61.80.148.197:3004
